# 舞蹈导航配置文件
# Dance Navigation Configuration File

# 基础配置
basic_config:
  backstage_pos: [-0.6, 0, 0]  # 后台位置 [x, y, theta]
  threshold: 0.5  # 到达阈值（米）
  waypoint_timeout: 20.0  # 航点超时时间（秒）
  max_goal_retries: 2  # 最大重试次数

# 舞蹈编排配置
dance_choreography:
  A:
    waypoints:
      - position: [-2.3, 3.4, 170]
        wait_time: 30.0
        description: "第一个舞蹈位置"
      - position: [-2.4, 3.4, 180]
        wait_time: 40.0
        description: "第二个舞蹈位置"
      - position: [-2.6, 3.4, -170]
        wait_time: 20.0
        description: "第三个舞蹈位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"
    
  B:
    waypoints:
      - position: [-2.1, 3.4, 170]
        wait_time: 20.0
        description: "第一个舞蹈位置"
      - position: [-2.3, 3.4, 180]
        wait_time: 40.0
        description: "第二个舞蹈位置"
      - position: [-2.6, 3.4, -170]
        wait_time: 20.0
        description: "第三个舞蹈位置"
      - position: [-2.8, 3.4, 180]
        wait_time: 12.5
        description: "第四个舞蹈位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"
    
  X:
    waypoints:
      - position: [-2.18, 3.0, -159]
        wait_time: 30.0
        description: "第一个舞蹈位置"
      - position: [-2.3, 3.2, 135]
        wait_time: 40.0
        description: "第二个舞蹈位置"
      - position: [-2.5, 3.3, -45]
        wait_time: 13.5
        description: "第三个舞蹈位置"
      - position: [-3.0, 3.4, -135]
        wait_time: 20.5
        description: "第四个舞蹈位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"
    
  Y:
    waypoints:
      - position: [-2.2, 3.0, 170]
        wait_time: 30.0
        description: "第一个舞蹈位置"
      - position: [-2.4, 3.2, 180]
        wait_time: 40.0
        description: "第二个舞蹈位置"
      - position: [-2.6, 3.4, -170]
        wait_time: 20.0
        description: "第三个舞蹈位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"
    
  Up:
    waypoints:
      - position: [-2.6, 3.4, 170]
        wait_time: 30.0
        description: "表演位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"
    
  Down:
    waypoints:
      - position: [-2.6, 3.4, 170]
        wait_time: 30.0
        description: "表演位置"
      - position: [-0.6, 0, 0]
        wait_time: 0
        description: "返回后台"

# TTS配置
tts_config:
  Up:
    text: "各位朋友，大家好。在江南水乡沙家浜，曾镌刻下一段军民同心、共抗敌寇的红色记忆。这里有指导员郭建光的壮志凌云，有阿庆嫂的机智沉着，有沙奶奶的慈爱坚毅，也有与敌人周旋的惊心动魄。接下来，让我们循着京剧《沙家浜》的经典旋律，一同穿越烽火岁月，重温那段充满斗争智慧与深厚情谊的历史！"
    action_dir: "start_b"
  
  Down:
    text: "各位朋友，经典的唱腔余韵悠长，烽火里的故事依旧动人。我们刚刚一同重温了郭建光的壮志、沙奶奶的坚韧，也深深记住了阿庆嫂垒起七星灶的过人智慧，更读懂了那份跨越岁月的军民鱼水情。本场沙家浜京剧选段演出到此圆满结束，感谢您的驻足与陪伴，我们下次再会！"
    action_dir: "start_x"

# 服务配置
service_config:
  dance_service_name: "play_dance"
  dance_service_timeout: 5.0
  rotation_service_name: "/unitree_cmd_vel_controller/set_rotation_enabled"

# 话题配置
topic_config:
  move_base_goal: "/move_base/goal"
  move_base_feedback: "/move_base/feedback"
  move_base_cancel: "/move_base/cancel"
  move_base_status: "/move_base/status"
  dance_direction: "dance_direction"
  cmd_vel: "/cmd_vel"

# 定时器配置
timer_config:
  movement_check_interval: 3.0
  status_log_interval: 10.0
  dance_trigger_interval: 2.0
  navigation_watchdog_interval: 8.0
  plan_failure_check_interval: 5.0
