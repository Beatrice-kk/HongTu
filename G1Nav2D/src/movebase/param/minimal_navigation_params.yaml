# 最小化导航参数配置 - 用于测试基本路径规划功能
# 这个配置移除了所有可能导致规划失败的复杂参数

# 全局规划器配置
global_planner:
  GlobalPlanner:
    use_quadratic: true
    use_dijkstra: true
    use_grid_path: false
    use_astar: false
    old_navfn_behavior: false
    lethal_cost: 253
    neutral_cost: 50
    cost_factor: 3.0
    publish_scale: 100
    planner_window_x: 0.0
    planner_window_y: 0.0
    default_tolerance: 0.0
    publish_potential: true

# 局部规划器配置
local_planner:
  TebLocalPlannerROS:
    # 基本运动参数
    max_vel_x: 2.0
    max_vel_x_backwards: 0.5
    max_vel_theta: 1.0
    acc_lim_x: 0.5
    acc_lim_theta: 0.5
    
    # 目标容差
    xy_goal_tolerance: 0.3
    yaw_goal_tolerance: 0.3
    
    # 障碍物处理 - 最小化敏感度
    min_obstacle_dist: 0.01
    inflation_dist: 0.02
    include_costmap_obstacles: false  # 暂时禁用代价地图障碍物
    include_dynamic_obstacles: false  # 暂时禁用动态障碍物
    
    # 优化参数 - 简化
    no_inner_iterations: 2
    no_outer_iterations: 2
    optimization_activate: true
    optimization_verbose: true
    
    # 权重设置 - 最小化障碍物影响
    weight_obstacle: 1.0
    weight_inflation: 0.01
    weight_optimaltime: 1.0
    weight_shortest_path: 0.0
    
    # 禁用复杂功能
    enable_homotopy_class_planning: false
    enable_multithreading: false
    costmap_converter_plugin: ""
    
    # 机器人足迹 - 最小化
    footprint_model:
      type: "circular"
      radius: 0.15

# 代价地图配置 - 最小化
global_costmap:
  plugins:
    - { name: static_layer, type: "costmap_2d::StaticLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
  
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 1.0
  publish_frequency: 1.0
  static_map: true
  rolling_window: false
  resolution: 0.05
  
  static_layer:
    map_topic: /map_2d
    track_unknown_space: false
  
  inflation_layer:
    inflation_radius: 0.05
    cost_scaling_factor: 1.0

local_costmap:
  plugins:
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
  
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  static_map: false
  rolling_window: true
  width: 3
  height: 3
  resolution: 0.05
  
  inflation_layer:
    inflation_radius: 0.03
    cost_scaling_factor: 1.0

# 恢复行为 - 简化
recovery_behaviors:
  - name: 'clear_costmap_global'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'rotate_recovery'
    type: 'rotate_recovery/RotateRecovery'

# 规划器参数 - 宽松设置
planner_frequency: 0.5
planner_patience: 20.0
planner_max_retries: 5

controller_frequency: 2.0
controller_patience: 10.0
controller_max_retries: 3

recovery_enabled: true
recovery_patience: 60.0
